server:
  port: 8080
  address: 127.0.0.1

app:
  version: 0.1.0
  # mode, tenant id and data root are resolved at startup from the command line
  # (--tenant/--no-tenant, --tenant-id, -Dapp.data-root or APP_DATA_ROOT) and applied as the
  # highest priority property source, so they are intentionally not declared here.
  tenant:
    allow-header-override: false
  limits:
    max-file-size-bytes: 52428800
    max-rows-per-sheet: 200000
    max-sheets: 50
    max-clone-count: 200
    max-bulk-delete: 500
    upload-ttl-minutes: 60
    preview-row-limit: 300
    preview-sample-rows: 20
    max-issue-details: 200
  ids:
    normalize-formula-refs: false
    hash-length: 32
  import:
    reject-duplicate-key: false
    duplicate-original-id-action: WARN
  export:
    default-delimiter: ","
    default-quote-all: false
    default-line-ending: CRLF
    default-bom: false
    default-managed-columns: KNOWN

  audit:
    # the prod profile disables the entry; dev keeps the trail on
    enabled: true
    page-size: 25

spring:
  application:
    name: otc-clear-testdata
  profiles:
    # dev is the working profile for development and testing; override with -Dspring.profiles.active=prod
    default: dev
  jackson:
    deserialization:
      use-big-decimal-for-floats: true
      fail-on-null-for-primitives: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 55MB
      max-request-size: 60MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    ac: INFO
    org.apache.poi: WARN
