<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('外部任务')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<nav th:replace="~{fragments/layout :: nav('external')}"></nav>

<main class="page">
  <div class="page-head">
    <div>
      <h2 class="page-title">外部批量导入任务</h2>
      <div class="page-sub">派发到外部批量导入工具，并回收其产出的 CSV 文件。</div>
    </div>
    <div class="row-actions">
      <button class="tool-btn" id="refreshJobsBtn">刷新</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="search" id="jobSearch" placeholder="搜索任务 ID / 请求 ID / 文件夹…">
    <select id="jobStatus">
      <option value="">全部状态</option>
      <option value="PENDING">PENDING</option>
      <option value="DISPATCHED">DISPATCHED</option>
      <option value="RUNNING">RUNNING</option>
      <option value="SUCCEEDED">SUCCEEDED</option>
      <option value="FAILED">FAILED</option>
      <option value="STOPPED">STOPPED</option>
      <option value="UNKNOWN">UNKNOWN</option>
    </select>
    <div class="spacer"></div>
    <a class="tool-btn" th:href="@{/outputs}">产出浏览</a>
  </div>

  <section class="panel" th:if="${!externalEnabled}">
    <div class="panel-body">
      <div class="issue WARN">
        <span>外部批量导入工具尚未启用（app.external.enabled=false）。派发请求会被拒绝，但本地文件夹与 input CSV 的生成逻辑仍可验证。</span>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="table-wrap">
      <table>
        <thead>
        <tr>
          <th>任务 ID</th><th>产品</th><th>状态</th><th class="num">用例</th>
          <th>外部任务 ID</th><th>创建时间</th><th>完成时间</th><th>说明</th><th>操作</th>
        </tr>
        </thead>
        <tbody id="jobRows"></tbody>
      </table>
    </div>
    <div class="panel-body"><div class="pagination" id="jobPager"></div></div>
  </section>
</main>

<div th:replace="~{fragments/layout :: toast}"></div>
<th:block th:replace="~{fragments/layout :: scripts('external')}"></th:block>
</body>
</html>
