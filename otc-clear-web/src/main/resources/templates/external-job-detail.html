<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('外部任务详情')}"></head>
<body th:attr="data-job-id=${jobId}">
<header th:replace="~{fragments/layout :: topbar}"></header>
<nav th:replace="~{fragments/layout :: nav('external')}"></nav>

<main class="page">
  <div class="page-head">
    <div>
      <h2 class="page-title" id="jobTitle">外部任务详情</h2>
      <div class="page-sub" id="jobSubtitle"></div>
    </div>
    <div class="row-actions">
      <button class="tool-btn" id="backBtn">返回列表</button>
      <button class="tool-btn" id="refreshStatBtn">刷新状态</button>
      <button class="tool-btn" id="scanBtn">扫描产出</button>
      <button class="tool-btn danger" id="stopBtn">停止任务</button>
    </div>
  </div>

  <section class="panel" style="margin-bottom:16px">
    <div class="panel-head"><h3>派发信息</h3></div>
    <div class="panel-body">
      <div class="kv" id="jobInfo"></div>
      <div class="divider"></div>
      <div class="muted" style="font-size:12px;margin-bottom:6px">派发载荷</div>
      <div class="code-box" id="jobPayload">{}</div>
      <div class="muted" style="font-size:12px;margin:10px 0 6px">最近响应</div>
      <div class="code-box" id="jobResponse"></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h3>产出文件</h3><span class="muted" id="outputCount"></span></div>
    <div class="table-wrap">
      <table>
        <thead>
        <tr><th>文件</th><th>状态</th><th class="num">大小</th><th class="num">用例</th><th>发现时间</th><th>说明</th><th>操作</th></tr>
        </thead>
        <tbody id="jobOutputRows"></tbody>
      </table>
    </div>
  </section>
</main>

<div th:replace="~{fragments/layout :: toast}"></div>
<th:block th:replace="~{fragments/layout :: scripts('external-detail')}"></th:block>
</body>
</html>
