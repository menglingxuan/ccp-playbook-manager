<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('关于')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<nav th:replace="~{fragments/layout :: nav('about')}"></nav>

    <div>
      <h2 class="page-title">关于</h2>
      <div class="page-sub">运行模式、租户、数据目录与版本。</div>
