<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('外部任务')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('outputs')}"></header>

<main class="page">
  <div class="page-head">
    <div>
      <h2 class="page-title">外部任务</h2>
      <div class="page-sub">外部任务产出与派发记录（原「产出浏览」）。</div>
    </div>
    <div class="row-actions">
      <button class="tool-btn" id="refreshOutputsBtn">刷新</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="search" id="outputJobFilter" placeholder="按来源任务 ID 过滤…">
    <div class="spacer"></div>
  </div>

  <section class="panel">
    <div class="table-wrap">
      <table>
        <thead>
        <tr>
          <th>文件</th><th>外部任务</th><th>状态</th><th class="num">大小</th>
          <th class="num">用例</th><th>发现时间</th><th>说明</th><th>操作</th>
        </tr>
        </thead>
        <tbody id="outputRows"></tbody>
      </table>
    </div>
    <div class="panel-body"><div class="pagination" id="outputPager"></div></div>
  </section>
</main>

<div th:replace="~{fragments/layout :: toast}"></div>
<th:block th:replace="~{fragments/layout :: scripts('outputs')}"></th:block>
</body>
</html>
