<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('批次浏览')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('batches')}"></header>

<!-- recent and pinned batches; the toggle opens the management drawer -->
<nav class="batch-dock" id="batchDock" aria-label="批次停靠栏"></nav>
<aside class="batch-panel" id="batchPanel" aria-label="批次管理" hidden></aside>
<aside class="batch-panel fav-panel" id="favoritesPanel" aria-label="收藏夹" hidden></aside>

<main class="page console-page">
  <div class="console-bar">
    <div class="console-search">
      <input type="search" id="globalSearch" autocomplete="off"
             placeholder="搜索批次 / 用例 / 字段值…  支持 tag: product: case: value: scope:"
             title="回车执行全局搜索（G）；限定词：tag: product: batch: case: value: note: file: scope:">
      <button class="tool-btn" id="globalSearchBtn" title="全局搜索（G）">全局搜索</button>
      <button class="tool-btn ghost" id="consoleHelpBtn" title="快捷键与语法（?）">?</button>
    </div>
    <div class="console-chips" id="filterChips"></div>
  </div>

  <div class="console-layout">
    <aside class="console-side" id="consoleSide" aria-label="用例列表">
      <div class="side-head">
        <span class="side-title">用例</span>
        <span class="side-count" id="caseCount">0</span>
        <span class="side-nav" id="caseNav"></span>
        <button class="side-btn" id="sideCollapse" title="折叠侧栏">‹</button>
      </div>
      <div class="side-filters">
        <input type="search" id="caseSearch" placeholder="搜索用例 ID / Trade ID / 字段值…">
        <div class="side-filter-row">
          <select id="caseSort">
            <option value="row">原始顺序</option>
            <option value="testcase_asc">用例 ID ↑</option>
            <option value="testcase_desc">用例 ID ↓</option>
            <option value="key_asc">Trade ID ↑</option>
            <option value="key_desc">Trade ID ↓</option>
            <option value="formulas_desc">公式数 ↓</option>
            <option value="updated_desc">更新时间 ↓</option>
          </select>
          <select id="caseFormula">
            <option value="">全部用例</option>
            <option value="true">仅含公式</option>
          </select>
        </div>
      </div>
      <div class="side-summary" id="caseSummary"></div>
      <div class="side-list" id="caseList"></div>
      <div class="side-foot" id="caseFoot"></div>
    </aside>

    <button class="side-expand" id="sideExpand" title="展开侧栏" hidden>›</button>

    <section class="console-main" id="consoleMain">
      <div class="detail-head" id="detailHead"></div>
      <div class="detail-filters" id="detailFilters"></div>
      <div class="detail-body" id="detailBody"></div>
    </section>
  </div>
</main>

<div th:replace="~{fragments/layout :: toast}"></div>
<th:block th:replace="~{fragments/layout :: scripts('batches')}"></th:block>
</body>
</html>
