<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('导入任务')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('tasks')}"></header>

<main class="page">
  <section class="summary" id="summaryCards"></section>

  <div class="filters" id="taskChips"></div>

  <div class="toolbar">
    <input type="search" id="taskSearch" placeholder="搜索 任务 ID / 任务名称 / 文件名 / 基产品">
    <select id="taskProduct"></select>
    <label class="toolbar-date">创建日期
      <input type="date" id="taskFrom" aria-label="创建日期起">
      <span class="muted">–</span>
      <input type="date" id="taskTo" aria-label="创建日期止">
    </label>
    <div class="spacer"></div>
    <button class="tool-btn primary" id="newImportBtn">新建导入</button>
  </div>

  <section class="panel">
    <div class="table-wrap">
      <table id="taskTable">
        <thead>
        <tr>
          <th class="id-col" title="任务 ID 为每次导入随机生成的 UUID">任务 ID</th>
          <th class="name-col th-sort" data-sort="name" tabindex="0" title="按任务名称排序：升序 / 降序 / 原始顺序">任务名称<span class="sort-arrow"></span></th>
          <th>类型</th>
          <th class="source-col">源文件</th>
          <th class="num th-sort" data-sort="batches" tabindex="0" title="按批次数排序：升序 / 降序 / 原始顺序">批次数<span class="sort-arrow"></span></th>
          <th>基产品</th>
          <th class="th-sort" data-sort="created" tabindex="0" title="按创建时间排序：升序 / 降序 / 原始顺序（默认倒序）">创建时间<span class="sort-arrow"></span></th>
          <th data-no-resize="true">操作</th>
        </tr>
        </thead>
        <tbody id="taskRows"></tbody>
      </table>
    </div>
    <div class="panel-body">
      <div class="pagination" id="taskPager"></div>
    </div>
  </section>

  <p class="footer-note">数据目录由启动参数决定；删除任务会级联软删批次与用例。</p>
</main>

<div th:replace="~{fragments/layout :: toast}"></div>
<th:block th:replace="~{fragments/layout :: scripts('tasks')}"></th:block>
</body>
</html>
