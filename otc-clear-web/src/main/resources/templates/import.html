<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('导入向导')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('import')}"></header>

<main class="page">
  <div class="steps">
    <span class="step active" id="step1">① 选择文件</span>
    <span class="step" id="step2">② 确认布局</span>
    <span class="step" id="step3">③ 提交导入</span>
  </div>

  <section class="panel" id="uploadPanel">
    <div class="panel-body">
      <div class="dropzone" id="dropzone">
        <strong>拖拽文件到此处，或点击选择</strong>
        支持 .xlsx / .xls / .csv，单个文件不超过 50MB
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="hidden">
      </div>
      <div id="uploadInfo" class="muted" style="margin-top:12px"></div>
    </div>
  </section>

  <section class="layout hidden" id="wizardArea" style="margin-top:16px">
    <aside class="sidebar">
      <div class="sidebar-head"><span>Sheet 列表</span><span class="count" id="sheetCount">0</span></div>
      <div id="sheetList"></div>
    </aside>

    <div class="wizard-main">
    <section class="panel">
      <div class="panel-head">
        <h3 id="sheetTitle">预览</h3>
        <div class="row-actions">
          <span class="status-lamp" id="validityLamp">等待预览</span>
          <button class="tool-btn primary" id="submitImportBtn" disabled>提交当前 Sheet</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="params wizard-params">
          <div class="field">
            <label for="productSelect">产品</label>
            <select id="productSelect">
              <option value=""></option>
            </select>
            <div class="hint hidden" id="productValidityHint"></div>
          </div>
          <div class="field">
            <label for="headerRow">列名行号</label>
            <input type="number" id="headerRow" min="1" step="1">
          </div>
          <div class="field">
            <label for="tradeStartColumn">定义起始列</label>
            <input type="number" id="tradeStartColumn" min="1" step="1">
          </div>
          <div class="field">
            <label for="dataStartRow">数据起始行</label>
            <input type="number" id="dataStartRow" min="1" step="1">
          </div>
          <div class="field">
            <label for="dataEndRow">数据结束行</label>
            <input type="number" id="dataEndRow" min="1" step="1" placeholder="末尾">
          </div>
          <div class="field">
            <label>导入选项</label>
            <div class="setting-list">
              <label class="setting"><input type="checkbox" id="includeManagedColumns" checked>导入管理列</label>
              <label class="setting"><input type="checkbox" id="includeUnmappedColumns">导入未映射列</label>
              <label class="setting"><input type="checkbox" id="stopAtEmptyRow">空行前停止</label>
              <label class="setting"><input type="checkbox" id="stopAtFirstError" checked>错误行前停止</label>
            </div>
          </div>
        </div>

        <div class="legend hidden" id="previewLegend">
          <span class="trade">交易字段</span>
          <span class="managed">管理列</span>
          <span class="unmapped">未映射列</span>
          <span class="fx"><i class="fx-flag">ƒ</i> 公式单元格</span>
        </div>

        <div class="table-wrap" id="previewWrap" style="max-height:46vh">
          <table id="previewTable">
            <thead><tr id="previewHead"></tr></thead>
            <tbody id="previewBody"></tbody>
          </table>
        </div>
        <div id="previewMore" class="mono-sm preview-more"></div>

        <div id="previewStats" class="mono-sm" style="margin-top:10px"></div>

        <details class="issues-panel" id="previewIssuePanel">
          <summary id="previewIssueSummary">问题</summary>
          <div class="issues" id="previewIssues"></div>
        </details>
      </div>
    </section>

    <section class="panel hidden" id="resultPanel">
      <div class="panel-head"><h3 id="resultTitle">导入结果</h3></div>
      <div class="panel-body" id="resultBody"></div>
    </section>
    </div>
  </section>
</main>

<div th:replace="~{fragments/layout :: toast}"></div>
<th:block th:replace="~{fragments/layout :: scripts('import')}"></th:block>
</body>
</html>
