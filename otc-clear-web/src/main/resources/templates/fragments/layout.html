<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} + ' · ' + #{app.title}">OTC Clear 测试数据管理平台</title>
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header th:fragment="topbar" class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <div class="topbar-title" th:text="#{app.title}">OTC Clear 测试数据管理平台</div>
      <div class="topbar-sub" id="ctxSub" th:text="#{common.loading}">加载中…</div>
    </div>
    <div class="topbar-right">
      <span class="env-badge" id="ctxBadge">…</span>
      <select class="top-select" id="langSelect" th:title="#{shell.language}" aria-label="Language">
        <option value="zh-CN" th:text="#{lang.zh-CN}">简体中文</option>
        <option value="zh-HK" th:text="#{lang.zh-HK}">简体中文（香港）</option>
        <option value="en" th:text="#{lang.en}">English</option>
      </select>
      <select class="top-select" id="themeSelect" th:title="#{shell.theme}">
        <option value="light" th:text="#{theme.light}">默认浅色</option>
        <option value="theme-dark" th:text="#{theme.dark}">深色</option>
        <option value="theme-warm" th:text="#{theme.warm}">暖阳</option>
        <option value="theme-forest" th:text="#{theme.forest}">森林</option>
        <option value="theme-midnight" th:text="#{theme.midnight}">午夜</option>
        <option value="theme-ocean" th:text="#{theme.ocean}">海洋</option>
        <option value="theme-graphite" th:text="#{theme.graphite}">石墨</option>
        <option value="theme-violet" th:text="#{theme.violet}">紫罗兰</option>
        <option value="theme-sunset" th:text="#{theme.sunset}">日落</option>
        <option value="theme-neon" th:text="#{theme.neon}">霓虹</option>
        <option value="theme-aurora" th:text="#{theme.aurora}">极光</option>
      </select>
    </div>
  </div>
</header>

<nav th:fragment="nav(active)" class="nav">
  <div class="nav-inner">
    <a class="nav-link" th:classappend="${active == 'tasks' ? 'active' : ''}" th:href="@{/}"
       th:text="#{nav.tasks}">任务面板</a>
    <a class="nav-link" th:classappend="${active == 'import' ? 'active' : ''}" th:href="@{/import}"
       th:text="#{nav.import}">导入向导</a>
    <a class="nav-link" th:classappend="${active == 'outputs' ? 'active' : ''}" th:href="@{/outputs}"
       th:text="#{nav.outputs}">产出浏览</a>
    <a class="nav-link" th:classappend="${active == 'external' ? 'active' : ''}" th:href="@{/external-jobs}"
       th:text="#{nav.external}">外部任务</a>
    <a class="nav-link" th:classappend="${active == 'products' ? 'active' : ''}" th:href="@{/products}"
       th:text="#{nav.products}">产品定义</a>
    <a class="nav-link" th:classappend="${active == 'meta' ? 'active' : ''}" th:href="@{/meta}"
       th:text="#{nav.meta}">字段元信息</a>
    <a class="nav-link" th:classappend="${active == 'about' ? 'active' : ''}" th:href="@{/about}"
       th:text="#{nav.about}">关于</a>
  </div>
</nav>

<div th:fragment="toast" class="toast-host" id="toastHost"></div>

<th:block th:fragment="scripts(module)">
  <script type="module" th:src="@{'/js/pages/' + ${module} + '.js'}"></script>
</th:block>

</body>
</html>
