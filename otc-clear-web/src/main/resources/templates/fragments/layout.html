<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} + ' · OTC Clear 测试数据'">OTC Clear 测试数据</title>
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header th:fragment="topbar" class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <div class="topbar-title">OTC Clear 测试数据管理平台</div>
      <div class="topbar-sub" id="ctxSub">正在加载运行信息…</div>
    </div>
    <div class="topbar-right">
      <span class="env-badge" id="ctxBadge">…</span>
      <select class="top-select" id="themeSelect" title="风格配色">
        <option value="light">默认浅色</option>
        <option value="theme-dark">深色</option>
        <option value="theme-warm">暖阳</option>
        <option value="theme-forest">森林</option>
        <option value="theme-midnight">午夜</option>
        <option value="theme-ocean">海洋</option>
        <option value="theme-graphite">石墨</option>
        <option value="theme-violet">紫罗兰</option>
        <option value="theme-sunset">日落</option>
        <option value="theme-neon">霓虹</option>
        <option value="theme-aurora">极光</option>
      </select>
    </div>
  </div>
</header>

<nav th:fragment="nav(active)" class="nav">
  <div class="nav-inner">
    <a class="nav-link" th:classappend="${active == 'tasks' ? 'active' : ''}" th:href="@{/}">任务面板</a>
    <a class="nav-link" th:classappend="${active == 'import' ? 'active' : ''}" th:href="@{/import}">导入向导</a>
    <a class="nav-link" th:classappend="${active == 'outputs' ? 'active' : ''}" th:href="@{/outputs}">产出浏览</a>
    <a class="nav-link" th:classappend="${active == 'external' ? 'active' : ''}" th:href="@{/external-jobs}">外部任务</a>
    <a class="nav-link" th:href="@{/products}">产品定义</a>
    <a class="nav-link" th:href="@{/about}">关于</a>
  </div>
</nav>

<div th:fragment="toast" class="toast-host" id="toastHost"></div>

<th:block th:fragment="scripts(module)">
  <script type="module" th:src="@{'/js/pages/' + ${module} + '.js'}"></script>
</th:block>

</body>
</html>
